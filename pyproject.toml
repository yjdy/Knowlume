[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowlume"
version = "0.1.0"
description = "A local-first personal knowledge operating system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
keywords = ["knowledge-management", "local-first", "markdown", "notes"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "packaging>=24.2",
    "platformdirs>=4.3",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.34",
]
zotero = []
all = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.34",
]

[project.urls]
Homepage = "https://github.com/yjdy/Knowlume"
Repository = "https://github.com/yjdy/Knowlume"
Issues = "https://github.com/yjdy/Knowlume/issues"
Releases = "https://github.com/yjdy/Knowlume/releases"

[project.scripts]
kb = "knowlume.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowlume"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "knowlume/_assets/schemas"
"templates/v1" = "knowlume/_assets/templates/v1"
"templates/v2" = "knowlume/_assets/templates/v2"
"templates/config" = "knowlume/_assets/templates/config"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/templates/v1",
    "/templates/v2",
    "/templates/config",
    "/tests",
    "/plan",
    "/README.md",
    "/CLI.md",
    "/AGENTS.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.knowlume.release]
testpypi-enabled = false
pypi-prerelease-enabled = false
pypi-stable-enabled = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
