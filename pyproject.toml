[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowlume"
version = "0.1.0"
description = "A local-first personal knowledge operating system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "typer>=0.16",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
kb = "kb.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
