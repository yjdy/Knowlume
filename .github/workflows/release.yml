name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run --no-sync pytest -p no:cacheprovider
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync mypy src tests scripts
      - run: uv run --no-sync python scripts/check_release_tag.py "${{ github.ref_name }}"

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv build
      - run: python scripts/verify_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_release_tag.py "${{ github.ref_name }}" --target testpypi
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    runs-on: ubuntu-latest
    needs: publish-testpypi
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install published package
        run: >-
          uv tool run
          --index https://test.pypi.org/simple/
          --default-index https://pypi.org/simple/
          --from "knowlume==${GITHUB_REF_NAME#v}"
          kb --version

  publish-pypi:
    runs-on: ubuntu-latest
    needs: testpypi-smoke
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_release_tag.py "${{ github.ref_name }}" --target pypi
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - run: python scripts/generate_release_metadata.py dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
